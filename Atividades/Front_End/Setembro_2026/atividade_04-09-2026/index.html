<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Página de Cadastro</title>
  </head>
  <body>
    <form action="POST" class="conteiner">
      <header>
        <h1>Criar sua conta</h1>
        <p>Preencha seus dados para começar</p>
      </header>
      <section class="name_email">
        <div class="input_group">
          <label for="name">Nome Completo:</label>
          <input id="name" type="text" placeholder="Digite seu nome" />
        </div>
        <div class="input_group">
          <label for="email">Email:</label>
          <input id="email" type="email" placeholder="Digite seu email" />
        </div>
        <a href="">Esqueceu a senha?</a>
      </section>
      <fieldset>
        <div class="date_gender">
          <label for="date">Data de Nascimento:</label>
          <input type="date" name="" id="date" />
        </div>
        <div class="date_gender">
          <label for="select_gender">Gênero:</label>
          <select name="select" id="select_gender" placeholder="Selecione">
            <option value="Masculino">Masculino</option>
            <option value="Feminino">Feminino</option>
            <option value="Outro">Outro</option>
            <option value="Prefiro não dizer">Prefiro não dizer</option>
          </select>
        </div>
      </fieldset>
      <h2>Termos de uso</h2>
      <section class="terms">
        <div class="terms_check">
          <input type="checkbox" name="" id="terms_box" />
          <label for="terms_box"
            >Li e concordo com os termos
            <em><a href="/">Termos de uso</a></em> e
            <em><a href="/">Política de Privacidade.</a></em>
          </label>
        </div>
        <div class="btn_cadastrar">
          <button>Cadastrar</button>
        </div>
        <div class="tem_conta">
          <p>Já tem uma conta?<a href="/"> Entrar</a></p>
        </div>
      </section>
    </form>
  </body>
</html>
