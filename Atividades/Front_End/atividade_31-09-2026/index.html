<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Página de Login</title>
  </head>
  <body>
    <img
      id="img1"
      src="img/ChatGPT Image 2 de set. de 2026, 19_12_01.png"
      alt="" />
    <div class="conteiner">
      <div id="conteiner_loginPage"></div>
      <div id="title"><h1>Entrar na conta</h1></div>
      <div class="input input_user_conteiner">
        <label class="label_txt" for="input_txt">E-mail ou Usuário:</label
        ><br />
        <input id="input_txt" type="text" placeholder="   Digite seu E-mail ou Usuário"/>
      </div>
      <div class="input input_password_conteiner">
        <label class="label_txt" for="input_password">Senha:</label><br />
        <input id="input_password" type="password" placeholder="   Digite sua Senha" autofocus/>
        <a href="" id="Forgotten_pass" target="_blank">Esqueceu a Senha?</a>
      </div>
      <div><input id="button_enter" value="Entrar" type="submit"></div>
      <div>
        <p class="input_question">
          Não tem conta?
          <a id="link_cadastro" href="" target="_blank">Cadastre-se</a>
        </p>
      </div>
    </div>
  </body>
</html>
