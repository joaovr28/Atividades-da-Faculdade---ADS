<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Página de Login</title>
  </head>
  <body>
    <img id="img1" src="img/ChatGPT Image 2 de set. de 2026, 19_12_01.png" alt="">
    <div class="conteiner">
      <div id="conteiner_loginPage"></div>
      <div><h1>Entrar na sua conta</h1></div>
      <div class="input input_user">
        <label for="input_txt">E-mail ou Usuário</label>
        <input id="input_txt" type="text" />
      </div>
      <div class="input input_password">
        <label for="input_password">Senha</label>
        <input id="input_password" type="password" />
        <p>Esqueceu a Senha?</p>
      </div>
      <div><button id="button_entrar">Entrar</button></div>
      <div>
        <p>Não tem conta? <a id="link_cadastro" href="" target="_blank">Cadastre-se</a></p>
      </div>
    </div>
  </body>
</html>
