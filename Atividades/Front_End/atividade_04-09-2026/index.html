<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página de Cadastro</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="conteiner">
      <div class="header"><h1 class="form_title">Fazer cadastro</h1></div>
      <form>
        <div class="conteiner_input">
          <label for="Name">Nome:</label>
          <input id="Name" type="text" placeholder="  Seu nome completo" />
        </div>
        <div class="conteiner_input">
          <label for="Email">Email:</label>
          <input
            id="Email"
            type="email"
            placeholder="  Seu email@exemplo.com" />
        </div>
        <div class="conteiner_input">
          <label for="password">Senha:</label>
          <input id="password" type="password" placeholder="  Sua senha" />
        </div>
      </form>
      <div class="terms_check">
        <select name="select" id="" aria-placeholder="Selecione">
          <option value="Masculino">Masculino</option>
          <option value="Feminino">Feminino</option>
          <option value="Outro">Outro</option>
          <option value="Prefiro não dizer">Prefiro não dizer</option>
        </select>
        <div>
          <label for="date">Data:</label>
          <input id="date" type="date" placeholder="DD/MM/AAAA" />
        </div>
        <div
          id="checkbox
          ">
          <input type="checkbox" name="termos" id="termos" />
          <label for="termos">Aceitar os termos</label>
        </div>
      </div>
      <div class="button-env"><button type="submit">Cadastrar</button></div>
    </main>
  </body>
</html>
