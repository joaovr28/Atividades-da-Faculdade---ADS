<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bounce Tales MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e; /* Fundo escuro atrás do canvas */
            touch-action: none; /* Previne scroll acidental no mobile */
        }
        
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            background-color: #00bfff; /* Cor do céu inspirada na imagem */
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: block;
            /* Faz o canvas preencher a tela mantendo a proporção ideal se necessário, 
               mas o JS lidará com o resize dinâmico */
        }

        /* Controles Mobile */
        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            pointer-events: none;
            box-sizing: border-box;
        }

        .control-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .btn-control {
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: white;
            user-select: none;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }

        .btn-control:active {
            background-color: rgba(255, 255, 255, 0.6);
        }

        /* Telas de UI (Menu, Game Over) */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            z-index: 10;
            transition: opacity 0.3s;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- Controles Touch para Mobile -->
    <div class="controls" id="touchControls">
        <div class="control-group">
            <div class="btn-control" id="btnLeft">←</div>
            <div class="btn-control" id="btnRight">→</div>
        </div>
        <div class="control-group">
            <div class="btn-control" id="btnJump">↑</div>
        </div>
    </div>

    <!-- UI: Menu Inicial -->
    <div id="startScreen" class="ui-layer">
        <h1 class="text-6xl font-black text-red-500 mb-4 drop-shadow-[0_4px_4px_rgba(255,255,255,0.8)]" style="font-family: impact, sans-serif; -webkit-text-stroke: 2px white;">BOUNCE MVP</h1>
        <p class="mb-8 text-xl">Use as setas (ou botões na tela) para mover e pular.</p>
        <button id="btnStart" class="px-8 py-4 bg-green-500 hover:bg-green-600 text-white font-bold rounded-full text-2xl shadow-lg transform transition hover:scale-105">
            Jogar
        </button>
    </div>

    <!-- UI: Game Over -->
    <div id="gameOverScreen" class="ui-layer hidden">
        <h1 class="text-5xl font-bold text-white mb-4">Você Caiu!</h1>
        <button id="btnRestart" class="px-8 py-4 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-full text-2xl shadow-lg transform transition hover:scale-105">
            Tentar Novamente
        </button>
    </div>
    
    <!-- UI: Vitória -->
    <div id="winScreen" class="ui-layer hidden">
        <h1 class="text-5xl font-bold text-yellow-400 mb-4">Nível Concluído!</h1>
        <button id="btnNext" class="px-8 py-4 bg-yellow-500 hover:bg-yellow-600 text-white font-bold rounded-full text-2xl shadow-lg transform transition hover:scale-105">
            Jogar Novamente
        </button>
    </div>
</div>

<script>
/**
 * ARQUITETURA DO JOGO (Baseado em SRP - Single Responsibility Principle)
 * 1. InputHandler: Gerencia entradas do usuário (teclado e toque).
 * 2. Player: Mantém o estado, física e renderização da bola.
 * 3. Platform: Define os obstáculos e chãos verdes.
 * 4. Game: Controla o loop principal, colisões e a câmera.
 */

// --- 1. GERENCIADOR DE ENTRADAS ---
class InputHandler {
    constructor() {
        this.keys = {
            left: false,
            right: false,
            jump: false
        };

        // Teclado
        window.addEventListener('keydown', (e) => this.handleKeyDown(e));
        window.addEventListener('keyup', (e) => this.handleKeyUp(e));

        // Touch (Mobile)
        this.setupTouchControl('btnLeft', 'left');
        this.setupTouchControl('btnRight', 'right');
        this.setupTouchControl('btnJump', 'jump');
    }

    handleKeyDown(e) {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.keys.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') this.keys.right = true;
        if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') this.keys.jump = true;
    }

    handleKeyUp(e) {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') this.keys.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') this.keys.right = false;
        if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') this.keys.jump = false;
    }

    setupTouchControl(elementId, keyName) {
        const el = document.getElementById(elementId);
        if (!el) return;
        
        el.addEventListener('touchstart', (e) => {
            e.preventDefault();
            this.keys[keyName] = true;
        });
        
        el.addEventListener('touchend', (e) => {
            e.preventDefault();
            this.keys[keyName] = false;
        });
    }
}

// --- 2. ENTIDADE DO JOGADOR (A BOLA) ---
class Player {
    constructor(x, y) {
        this.radius = 20;
        this.x = x;
        this.y = y;
        
        // Física
        this.vx = 0;
        this.vy = 0;
        this.speed = 5;
        this.jumpForce = -12;
        this.gravity = 0.6;
        this.friction = 0.8; // Fricção no chão
        
        this.isGrounded = false;
    }

    update(input) {
        // Movimento horizontal
        if (input.keys.left) {
            this.vx -= 1;
        } else if (input.keys.right) {
            this.vx += 1;
        } else {
            // Desaceleração quando não há input
            this.vx *= this.friction;
        }

        // Limite de velocidade horizontal
        this.vx = Math.max(-this.speed, Math.min(this.speed, this.vx));

        // Pulo
        if (input.keys.jump && this.isGrounded) {
            this.vy = this.jumpForce;
            this.isGrounded = false;
        }

        // Aplica gravidade
        this.vy += this.gravity;

        // Limite de velocidade de queda
        if (this.vy > 15) this.vy = 15;

        // Atualiza posição
        this.x += this.vx;
        this.y += this.vy;
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        
        // Rotação visual baseada na velocidade X para dar efeito de rolamento
        // (x / raio = radianos)
        ctx.rotate(this.x / this.radius);

        // Corpo da bola (Vermelho)
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = '#ff0000';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#8b0000';
        ctx.stroke();
        ctx.closePath();

        // Brilho (Estilo desenho animado / imagem fornecida)
        ctx.beginPath();
        ctx.arc(-6, -6, 5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
        ctx.fill();
        ctx.closePath();

        ctx.restore();
    }
}

// --- 3. PLATAFORMAS ---
class Platform {
    constructor(x, y, w, h, isGoal = false) {
        this.x = x;
        this.y = y;
        this.w = w;
        this.h = h;
        this.isGoal = isGoal; // Define se a plataforma é a linha de chegada
    }

    draw(ctx) {
        if (this.isGoal) {
            // Renderiza plataforma de chegada (Dourada)
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(this.x, this.y, this.w, this.h);
            
            // Texto FINISH
            ctx.fillStyle = '#000';
            ctx.font = '20px sans-serif';
            ctx.fillText("FIM", this.x + this.w/2 - 15, this.y + 30);
            return;
        }

        // Estilo baseado na imagem (Grama por cima, terra escurecida embaixo)
        // Corpo (Terra)
        ctx.fillStyle = '#105010'; // Verde bem escuro
        ctx.fillRect(this.x, this.y, this.w, this.h);
        
        // Textura interna (Simulando os quadrados da imagem)
        ctx.fillStyle = '#156015';
        for(let i=0; i<this.w; i+=40) {
            for(let j=20; j<this.h; j+=40) {
                if((i+j)%80 === 0) ctx.fillRect(this.x + i, this.y + j, 40, 40);
            }
        }

        // Topo (Grama)
        ctx.fillStyle = '#32cd32'; // Verde claro
        ctx.fillRect(this.x, this.y, this.w, 20);
        
        // Detalhes da borda da grama
        ctx.fillStyle = '#00ff00';
        for(let i = 0; i < this.w; i += 20) {
            ctx.beginPath();
            ctx.arc(this.x + i + 10, this.y + 20, 10, 0, Math.PI);
            ctx.fill();
        }
    }
}

// --- 4. MOTOR DO JOGO ---
class Game {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        
        this.input = new InputHandler();
        this.state = 'MENU'; // MENU, PLAYING, GAMEOVER, WIN
        
        this.cameraX = 0;
        this.cameraY = 0;

        // Elementos de UI
        this.startScreen = document.getElementById('startScreen');
        this.gameOverScreen = document.getElementById('gameOverScreen');
        this.winScreen = document.getElementById('winScreen');

        this.setupButtons();
        this.resize();
        window.addEventListener('resize', () => this.resize());
        
        // Inicia o Loop, mas só atualiza lógica no estado PLAYING
        this.lastTime = 0;
        requestAnimationFrame((t) => this.gameLoop(t));
    }

    setupButtons() {
        document.getElementById('btnStart').addEventListener('click', () => this.startGame());
        document.getElementById('btnRestart').addEventListener('click', () => this.startGame());
        document.getElementById('btnNext').addEventListener('click', () => this.startGame());
    }

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }

    initLevel() {
        // Posição inicial do jogador
        this.player = new Player(100, 200);
        this.platforms = [];

        // Montagem do nível simulando as "escadas" e plataformas da imagem
        this.platforms.push(new Platform(0, 400, 600, 400)); // Chão inicial
        this.platforms.push(new Platform(750, 450, 200, 50)); // Plataforma flutuante
        this.platforms.push(new Platform(1100, 350, 200, 50)); // Plataforma flutuante alta
        
        // Escadaria como na imagem (lado direito)
        this.platforms.push(new Platform(1400, 500, 800, 400));
        this.platforms.push(new Platform(1600, 400, 600, 400));
        this.platforms.push(new Platform(1800, 300, 400, 400));
        this.platforms.push(new Platform(2000, 200, 200, 500)); // Topo
        
        // Plataforma final (Linha de chegada)
        this.platforms.push(new Platform(2400, 500, 300, 100, true));
    }

    startGame() {
        this.initLevel();
        this.state = 'PLAYING';
        
        // Oculta todas as telas UI
        this.startScreen.classList.add('hidden');
        this.gameOverScreen.classList.add('hidden');
        this.winScreen.classList.add('hidden');
    }

    gameOver() {
        this.state = 'GAMEOVER';
        this.gameOverScreen.classList.remove('hidden');
    }

    win() {
        this.state = 'WIN';
        this.winScreen.classList.remove('hidden');
    }

    checkCollisions() {
        // Lógica de colisão Circular/Retangular adaptada (AABB simplificado)
        this.player.isGrounded = false;

        for (let p of this.platforms) {
            // Pontos de verificação na bola (bounding box simples)
            let pr = this.player.radius;
            let px = this.player.x;
            let py = this.player.y;

            // Verifica sobreposição (AABB)
            if (px + pr > p.x && 
                px - pr < p.x + p.w && 
                py + pr > p.y && 
                py - pr < p.y + p.h) {
                
                // Se for a plataforma de vitória
                if (p.isGoal) {
                    this.win();
                    return;
                }

                // Resolve colisão determinando a direção de entrada
                // Usamos a velocidade e posição anterior para saber de onde a bola veio
                
                let overlapX = Math.min(px + pr - p.x, p.x + p.w - (px - pr));
                let overlapY = Math.min(py + pr - p.y, p.y + p.h - (py - pr));

                if (overlapX < overlapY) {
                    // Colisão Horizontal
                    if (this.player.vx > 0) { // Batendo na esquerda da plataforma
                        this.player.x = p.x - pr;
                    } else { // Batendo na direita da plataforma
                        this.player.x = p.x + p.w + pr;
                    }
                    this.player.vx = 0;
                } else {
                    // Colisão Vertical
                    if (this.player.vy > 0) { // Caindo no chão
                        this.player.y = p.y - pr;
                        this.player.vy = 0;
                        this.player.isGrounded = true;
                    } else { // Batendo a cabeça
                        this.player.y = p.y + p.h + pr;
                        this.player.vy = 0;
                    }
                }
            }
        }

        // Verifica se caiu no abismo
        if (this.player.y > this.canvas.height + 500) {
            this.gameOver();
        }
    }

    update() {
        if (this.state !== 'PLAYING') return;

        this.player.update(this.input);
        this.checkCollisions();

        // Câmera segue o jogador suavemente (Lerp)
        // Centraliza a câmera no jogador
        let targetCamX = this.player.x - this.canvas.width / 2;
        // Limita a câmera para não ir para trás do começo da fase
        if (targetCamX < 0) targetCamX = 0;
        
        this.cameraX += (targetCamX - this.cameraX) * 0.1;
    }

    draw() {
        // Limpa o canvas (Céu Azul)
        this.ctx.fillStyle = '#00bfff';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        
        // Nuvens simples decorativas no fundo (Parallax falso)
        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
        for(let i=0; i<10; i++) {
            let cx = (i * 300 - this.cameraX * 0.2) % 3000;
            this.ctx.beginPath();
            this.ctx.arc(cx, 100 + (i%3)*50, 40, 0, Math.PI*2);
            this.ctx.arc(cx+40, 100 + (i%3)*50, 50, 0, Math.PI*2);
            this.ctx.arc(cx+80, 100 + (i%3)*50, 40, 0, Math.PI*2);
            this.ctx.fill();
        }

        if (this.state === 'MENU') return;

        this.ctx.save();
        // Aplica translação da câmera
        this.ctx.translate(-this.cameraX, 0);

        // Desenha plataformas
        for (let p of this.platforms) {
            p.draw(this.ctx);
        }

        // Desenha o jogador
        this.player.draw(this.ctx);

        this.ctx.restore();
    }

    gameLoop(timestamp) {
        // deltaTime pode ser usado para movimento independente de framerate, 
        // mas em um MVP a lógica travada por frame é mais fácil de debugar e lidar.
        this.update();
        this.draw();
        
        requestAnimationFrame((t) => this.gameLoop(t));
    }
}

// Inicializa o jogo quando o DOM carregar completamente
window.onload = () => {
    const game = new Game();
};

</script>
</body>
</html>
